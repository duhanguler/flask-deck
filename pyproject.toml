[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "flask-deck"
version = "0.6.0"
description = "Enterprise & AI-Agent Operations Control Plane for Flask and SQLAlchemy 2.0 — zero Node build, zero CDN, SSO/Passkeys/MFA, four-eyes approvals, hash-chained audit, REST API & MCP server."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Duhan Güler", email = "45712664+duhanguler@users.noreply.github.com" },
]
keywords = [
    "flask",
    "admin",
    "flask-admin",
    "django-admin",
    "sqlalchemy",
    "wsgi",
    "dashboard",
    "crud",
    "rbac",
    "iam",
    "audit-log",
    "command-palette",
    "mcp",
    "rest-api",
    "passkeys",
    "django-unfold",
    "sqladmin",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: WSGI",
    "Topic :: Database :: Front-Ends",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "flask>=2.3.0",
    "werkzeug>=2.3.0",
    "sqlalchemy>=2.0.0",
    "jinja2>=3.1.0",
    "markupsafe>=2.1.0",
]

[project.optional-dependencies]
flask-sqlalchemy = [
    "flask-sqlalchemy>=3.1.0",
]
flask-login = [
    "flask-login>=0.6.3",
]
s3 = [
    "boto3>=1.34.0",
]
babel = [
    "flask-babel>=4.0.0",
]
pydantic = [
    "pydantic>=2.0.0",
]
redis = [
    "redis>=5.0.0",
]
webauthn = [
    "webauthn>=2.0.0",
]
crypto = [
    "cryptography>=42.0.0",
]
sso = [
    "authlib>=1.3.0",
]
excel = [
    "openpyxl>=3.1.0",
]
enterprise = [
    "redis>=5.0.0",
    "webauthn>=2.0.0",
    "cryptography>=42.0.0",
    "authlib>=1.3.0",
    "openpyxl>=3.1.0",
    "boto3>=1.34.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "flask-sqlalchemy>=3.1.0",
    "flask-login>=0.6.3",
]

[project.urls]
Homepage = "https://github.com/duhanguler/flask-deck"
Demo = "https://flask-deck.vercel.app"
Repository = "https://github.com/duhanguler/flask-deck"
Documentation = "https://github.com/duhanguler/flask-deck#readme"
Issues = "https://github.com/duhanguler/flask-deck/issues"
Changelog = "https://github.com/duhanguler/flask-deck/blob/main/CHANGELOG.md"

[project.scripts]
flask-deck = "flask_deck.cli:main"

[project.entry-points."flask.commands"]
deck = "flask_deck.cli:deck_cli"

[tool.hatch.build.targets.wheel]
packages = ["src/flask_deck"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
    "/benchmarks",
    "/docs",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests", "examples", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "flask_sqlalchemy.*",
    "flask_login.*",
    "sqlalchemy.*",
    "pytest.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["flask_deck"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
