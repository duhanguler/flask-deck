name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run ruff check src tests examples benchmarks
      - run: uv run mypy src
      - run: uv run pytest -m "not e2e and not postgres and not redis" -W error::ResourceWarning -W error::pytest.PytestUnraisableExceptionWarning --cov=flask_deck --cov-report=term-missing --cov-fail-under=90
      - run: uv run python benchmarks/bench_deck.py
      - run: uv build

  integration-pg-redis:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flask_deck
          POSTGRES_PASSWORD: flask_deck_test_password
          POSTGRES_DB: flask_deck_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U flask_deck -d flask_deck_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev --extra integration
      - name: Run live PostgreSQL 16 + Redis 7 integration & contract suites
        env:
          CI: "true"
          FLASK_DECK_TEST_PG_URL: postgresql+psycopg://flask_deck:flask_deck_test_password@127.0.0.1:5432/flask_deck_test
          FLASK_DECK_TEST_REDIS_URL: redis://127.0.0.1:6379/0
        run: uv run pytest -m "postgres or redis" -W error::ResourceWarning -W error::pytest.PytestUnraisableExceptionWarning

  e2e-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev --extra e2e
      - name: Cache Playwright Chromium binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - run: uv run playwright install --with-deps chromium
      - name: Run Playwright E2E + Air-Gap & Strict-CSP suite
        run: uv run pytest -m e2e
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: test-results/
          if-no-files-found: ignore
