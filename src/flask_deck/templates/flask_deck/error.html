{% extends "flask_deck/base.html" %}
{% block content %}
<div class="dk-content">
  <section class="dk-panel">
    <div class="dk-panel-head">
      <h1 class="dk-panel-title">{{ status_code }} · {{ error_title }}</h1>
      <span class="dk-badge dk-badge-danger dk-mono">HTTP {{ status_code }}</span>
    </div>
    <div class="dk-panel-body">
      <p class="dk-muted">{{ error_message }}</p>
      <a href="{{ url_for(bp_name ~ '.index') }}" class="dk-btn">Return to Dashboard</a>
    </div>
  </section>
</div>
{% endblock %}
