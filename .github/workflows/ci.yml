name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --extra dev
      - run: uv run ruff check src tests examples benchmarks
      - run: uv run mypy src
      - run: uv run pytest -W error::ResourceWarning -W error::pytest.PytestUnraisableExceptionWarning --cov=flask_deck --cov-report=term-missing
      - run: uv run python benchmarks/bench_deck.py
      - run: uv build
