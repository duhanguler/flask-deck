<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="flask-deck — Precision Admin Panel and Operations Workbench for Flask and SQLAlchemy 2.0">
  <rect width="1200" height="260" fill="#09090b" rx="8"/>
  <rect x="0.5" y="0.5" width="1199" height="259" fill="none" stroke="#222229" rx="8"/>
  <!-- Subtle architectural gridlines -->
  <line x1="0" y1="64" x2="1200" y2="64" stroke="#141418" stroke-width="1"/>
  <line x1="0" y1="196" x2="1200" y2="196" stroke="#141418" stroke-width="1"/>
  <line x1="88" y1="0" x2="88" y2="260" stroke="#141418" stroke-width="1"/>
  <line x1="1112" y1="0" x2="1112" y2="260" stroke="#141418" stroke-width="1"/>

  <!-- Brand Mark -->
  <rect x="88" y="78" width="44" height="44" rx="6" fill="#fafafa"/>
  <text x="110" y="109" text-anchor="middle" fill="#09090b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="700">D</text>

  <!-- Title & Tagline -->
  <text x="150" y="110" fill="#f4f4f5" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="42" font-weight="600" letter-spacing="-0.03em">flask-deck</text>
  <rect x="372" y="84" width="66" height="24" rx="4" fill="#141418" stroke="#27272a"/>
  <text x="405" y="100" text-anchor="middle" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">v0.3.0</text>

  <text x="88" y="158" fill="#a1a1aa" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="400">Precision Enterprise Admin Panel &amp; Operations Workbench for Flask &amp; SQLAlchemy 2.0</text>

  <!-- Telemetry Pills -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <rect x="88" y="182" width="136" height="26" rx="4" fill="#141418" stroke="#222229"/>
    <circle cx="102" cy="195" r="3.5" fill="#4ade80"/>
    <text x="114" y="199" fill="#f4f4f5">23.6 KB gzip</text>

    <rect x="234" y="182" width="144" height="26" rx="4" fill="#141418" stroke="#222229"/>
    <circle cx="248" cy="195" r="3.5" fill="#4ade80"/>
    <text x="260" y="199" fill="#f4f4f5">zero Node / CDN</text>

    <rect x="388" y="182" width="148" height="26" rx="4" fill="#141418" stroke="#222229"/>
    <circle cx="402" cy="195" r="3.5" fill="#60a5fa"/>
    <text x="414" y="199" fill="#f4f4f5">strict CSP nonce</text>

    <rect x="546" y="182" width="176" height="26" rx="4" fill="#141418" stroke="#222229"/>
    <circle cx="560" cy="195" r="3.5" fill="#fbbf24"/>
    <text x="572" y="199" fill="#f4f4f5">S3 · TOTP · OIDC</text>

    <rect x="732" y="182" width="166" height="26" rx="4" fill="#141418" stroke="#222229"/>
    <circle cx="746" cy="195" r="3.5" fill="#f4f4f5"/>
    <text x="758" y="199" fill="#f4f4f5">RTL · Cursor · SSE</text>
  </g>

  <!-- Right-side Minimal Sparkline Graphic -->
  <g transform="translate(918, 74)">
    <rect width="194" height="114" rx="6" fill="#0e0e11" stroke="#222229"/>
    <line x1="14" y1="34" x2="180" y2="34" stroke="#222229" stroke-dasharray="2 3"/>
    <line x1="14" y1="62" x2="180" y2="62" stroke="#222229" stroke-dasharray="2 3"/>
    <line x1="14" y1="90" x2="180" y2="90" stroke="#222229" stroke-dasharray="2 3"/>
    <path d="M18,86 L48,74 L78,78 L108,52 L138,58 L174,24 L174,90 L18,90 Z" fill="rgba(244,244,245,0.07)"/>
    <path d="M18,86 L48,74 L78,78 L108,52 L138,58 L174,24" fill="none" stroke="#f4f4f5" stroke-width="1.75"/>
    <circle cx="174" cy="24" r="3.5" fill="#0e0e11" stroke="#4ade80" stroke-width="1.75"/>
    <text x="14" y="21" fill="#71717a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">4 queries · 0 N+1</text>
    <text x="14" y="106" fill="#71717a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">SQLAlchemy 2.0 / WSGI</text>
  </g>
</svg>
